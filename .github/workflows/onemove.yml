on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          d=json.loads(urllib.request.urlopen("https://anonymous-309.github.io/FPL-xPoints/data.json").read())
          for p in d["players"]:
              if p["name"] in ("Virgil","Van Dijk","van Dijk") or "Dijk" in p.get("fullName",""):
                  g=str(d["gws"][0]); b=p["byGw"].get(g,{})
                  print("V", p["name"], p["status"], p["news"], "pitch", p.get("pitch"), "usual", p["minUsual"], "w5", p.get("w5Min"), "mins", b.get("mins"), "past", {k:p["pastMin"][k] for k in sorted(p["pastMin"], key=int)[-7:]}, "why", p.get("pastWhy"))
          PY
