on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sfL https://anonymous-309.github.io/FPL-xPoints/data.json -o /tmp/data.json
          python3 -c "
          import json, collections
          d=json.load(open('/tmp/data.json')); c=collections.Counter(); shown=collections.defaultdict(int)
          for p in d['players']:
              for g, ws in (p.get('pastWhy') or {}).items():
                  ns=(p.get('pastNote') or {}).get(g, [])
                  for w, n in zip(ws, ns):
                      if w and shown[w] < 3: print(w, p['name'], 'GW'+g, '|', n); shown[w]+=1
                      if w: c[(w, bool(n))]+=1
          print(c)
          "
