on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt >/dev/null
      - uses: actions/cache@v4
        with:
          path: fpl_data/20*
          key: fpl-history-v1
      - run: python fpl_xpoints.py download
      - run: PYTHONWARNINGS=ignore python fpl_xpoints.py backtest > new.txt 2>&1; tail -3 new.txt
      - run: sed -n '/=== Top FPL scorers/,/=== Decisions/p' new.txt
