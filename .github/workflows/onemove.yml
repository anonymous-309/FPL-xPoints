on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          d=json.loads(urllib.request.urlopen("https://anonymous-309.github.io/FPL-xPoints/data.json").read())
          for p in d["players"]:
              if "Mart" in p["name"]:
                  g=str(d["gws"][0]); b=p["byGw"].get(g,{})
                  print("M", p["name"], p["team"], p["status"], "|", p["news"], "| mins", b.get("mins"), "usual", p["minUsual"], "note", p.get("minNote"))
          b=json.loads(urllib.request.urlopen(urllib.request.Request("https://fantasy.premierleague.com/api/bootstrap-static/",headers={"User-Agent":"Mozilla/5.0"})).read())
          for p in b["elements"]:
              if "Mart" in p["web_name"]: print("F", p["web_name"], p["team"], p["status"], p["chance_of_playing_next_round"], p["news_added"], p["news"])
          PY
