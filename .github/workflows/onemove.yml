on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          b=json.loads(urllib.request.urlopen(urllib.request.Request("https://fantasy.premierleague.com/api/bootstrap-static/",headers={"User-Agent":"Mozilla/5.0"})).read())
          for p in b["elements"]:
              if p["web_name"] in ("Collins","Zubimendi","Gvardiol","Martinez","Gudmundsson"):
                  print("P", p["web_name"], p["team"], p["status"], p["chance_of_playing_next_round"], p["news_added"], "|", p["news"])
          PY
