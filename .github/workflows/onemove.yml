on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, collections
          H={"User-Agent":"Mozilla/5.0"}
          g=lambda p: json.loads(urllib.request.urlopen(urllib.request.Request("https://fantasy.premierleague.com/api/"+p,headers=H),timeout=30).read())
          b=g("bootstrap-static/"); f=g("fixtures/")
          T={t["id"]:t for t in b["teams"]}
          print("strength", sorted([(t["strength"],t["short_name"]) for t in b["teams"]]))
          for k in ["strength_overall_home","strength_overall_away","strength_attack_home","strength_attack_away","strength_defence_home","strength_defence_away"]:
              print(k, sorted([(t[k],t["short_name"]) for t in b["teams"]]))
          c=collections.Counter()
          for x in f: c[x["team_h_difficulty"]]+=1; c[x["team_a_difficulty"]]+=1
          print("difficulty counts", sorted(c.items()))
          per=collections.defaultdict(collections.Counter)
          for x in f:
              per[T[x["team_a"]]["short_name"]][("vs home", x["team_h_difficulty"])]+=1
              per[T[x["team_h"]]["short_name"]][("vs away", x["team_a_difficulty"])]+=1
          for t,v in sorted(per.items()): print(t, T[[i for i in T if T[i]["short_name"]==t][0]]["strength"], dict(v))
          fut=[x for x in f if not x["finished"]]
          c2=collections.Counter()
          for x in fut: c2[x["team_h_difficulty"]]+=1; c2[x["team_a_difficulty"]]+=1
          print("coming difficulty counts", sorted(c2.items()))
          PY
