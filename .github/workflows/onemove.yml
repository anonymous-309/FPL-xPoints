on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests >/dev/null
      - run: python tools/history_injuries.py 2024/2025 2025/2026
      - uses: actions/upload-artifact@v4
        with:
          name: injuries
          path: archive/injuries/
