on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, time
          H={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36","Accept":"application/json","Referer":"https://www.fotmob.com/"}
          def get(p,q):
              r=urllib.request.Request("https://www.fotmob.com/api/data/"+p+"?"+urllib.parse.urlencode(q),headers=H)
              return json.loads(urllib.request.urlopen(r,timeout=30).read())
          t=get("teams",{"id":8456,"ccode3":"GBR"})
          mem=[m for g in t["squad"]["squad"] for m in g["members"]]
          print("squad", len(mem), json.dumps(mem[3])[:400])
          for m in mem[:6]:
              pid=m["id"]
              for ep in ["playerData"]:
                  try:
                      d=get(ep,{"id":pid}); print(ep, m["name"], list(d.keys()))
                      rm=d.get("recentMatches")
                      print(" recentMatches type", type(rm).__name__, json.dumps(rm)[:1500])
                  except Exception as e: print(ep, "fail", e)
              time.sleep(0.5)
          PY
