on:
  push:
    branches: [analysis-41]
permissions:
  contents: write
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt >/dev/null
      - run: pip install requests >/dev/null
      - run: python tools/history_soccerway.py
      - name: Keep the file on the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f archive/injuries/soccerway_players.json.gz
          git commit -m "soccerway injury archive [skip ci]" && git push origin HEAD:analysis-41
