on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        lineup: ["", "actual", "xmin"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: fpl_data/20*
          key: fpl-history-v1
      - run: python fpl_xpoints.py download
      - run: XP_LINEUP="${{ matrix.lineup }}" PYTHONWARNINGS=ignore python fpl_xpoints.py backtest > bt.txt 2>&1; echo "LINEUP=[${{ matrix.lineup }}]"; grep -a -A16 'figure     n predicted' bt.txt; grep -a 'Penalty goals:\|R2 \|anytime AUC' bt.txt | head; sed -n '/=== /,$p' bt.txt | head -40
