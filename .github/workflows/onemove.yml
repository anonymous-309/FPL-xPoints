on:
  push:
    branches: [analysis-41]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt >/dev/null
      - uses: actions/cache@v4
        with:
          path: fpl_data/20*
          key: fpl-history-v1
      - run: python fpl_xpoints.py download
      - run: curl -sL https://anonymous-309.github.io/FPL-xPoints/backtest.txt -o old.txt; wc -l old.txt
      - run: PYTHONWARNINGS=ignore python fpl_xpoints.py backtest > new.txt 2>&1; tail -3 new.txt
      - name: Compare
        run: |
          for f in old.txt new.txt; do echo "##### $f"; grep -E "Past-season absences|^Model|^Trailing|^Long-run|Minutes MAE|Appearance|Score 1\+|Assist 1\+|Clean sheet" $f | head -30; sed -n '/=== Minutes by weighted/,/Minutes MAE/p' $f; sed -n '/=== Decisions/,/^$/p' $f; done
      - run: python fpl_xpoints.py site --out _site --offline 2>&1 | tail -3 || true
