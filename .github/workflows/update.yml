name: Cap nhat xPoints

on:
  schedule:
    # 00:30 UK time (30 minutes after FPL's daily price changes at midnight) and 10:00 UK time. UK clocks move, so both
    # UTC times are scheduled and the gate keeps the one that matches UK time today.
    - cron: "30 23 * * *"      # 00:30 UK in summer (BST)
    - cron: "30 0 * * *"       # 00:30 UK in winter (GMT)
    - cron: "0 9 * * *"        # 10:00 UK in summer
    - cron: "0 10 * * *"       # 10:00 UK in winter
    - cron: "30 */2 * * *"     # every 2 hours; runs only when the next deadline is under 24 hours away (see gate)
  workflow_dispatch:
    inputs:
      archive_gw:
        description: "Gameweek to archive after this run (set by archive.yml about 30 minutes before the deadline)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: write  # to save injury_log.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # queue instead, so the run before a deadline is never cancelled

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY2' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request, datetime as dt
          from zoneinfo import ZoneInfo
          cron = os.environ.get("CRON", "")
          summer = dt.datetime.now(ZoneInfo("Europe/London")).utcoffset() != dt.timedelta(0)
          uk = {"30 23 * * *": summer, "0 9 * * *": summer, "30 0 * * *": not summer, "0 10 * * *": not summer}
          if cron in uk:
              print(f"go={'true' if uk[cron] else 'false'}"); raise SystemExit
          if cron != "30 */2 * * *":
              print("go=true"); raise SystemExit
          try:
              req = urllib.request.Request("https://fantasy.premierleague.com/api/bootstrap-static/", headers={"User-Agent": "Mozilla/5.0"})
              ev = json.loads(urllib.request.urlopen(req, timeout=30).read())["events"]
          except Exception:
              print("go=false"); raise SystemExit
          now = dt.datetime.now(dt.timezone.utc)
          left = [(dt.datetime.fromisoformat(e["deadline_time"].replace("Z", "+00:00")) - now).total_seconds() / 3600 for e in ev]
          left = [h for h in left if h > 0]
          print(f"go={'true' if left and min(left) <= 24 else 'false'}")
          PY2
          cat "$GITHUB_OUTPUT"
  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: fpl_data/20*
          key: fpl-history-v1
      - name: Keep FotMob pages between runs (each is re-read only after 6 hours)
        uses: actions/cache@v4
        with:
          path: fpl_data/api_cache/fotmob
          key: fotmob-${{ github.run_id }}
          restore-keys: fotmob-
      - name: Download past seasons
        run: python fpl_xpoints.py download
      - name: Build the points table
        run: python fpl_xpoints.py site --out _site
      - name: Save the injury log
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add injury_log.json injury_subs.json cup_minutes.json intl_minutes.json 2>/dev/null || git add injury_log.json injury_subs.json cup_minutes.json 2>/dev/null || git add injury_log.json injury_subs.json 2>/dev/null || git add injury_log.json
          if git diff --cached --quiet; then echo "Injury log unchanged"; exit 0; fi
          git commit -m "Injury log: update"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Plan transfers for the teams in planner_ids.txt
        continue-on-error: true
        run: python planner.py --site _site --ids planner_ids.txt
      - name: Measure accuracy on last season
        continue-on-error: true
        run: PYTHONWARNINGS=ignore python fpl_xpoints.py backtest 2>&1 | tee _site/backtest.txt
      - name: Archive the numbers before the deadline
        if: ${{ github.event.inputs.archive_gw != '' && github.event.inputs.archive_gw != null }}
        continue-on-error: true
        run: |
          season=$(grep -m1 '^CURRENT_SEASON' fpl_xpoints.py | cut -d'"' -f2)
          dir="archive/$season/gw${{ github.event.inputs.archive_gw }}"
          mkdir -p "$dir"
          for f in data.json team_news.json fixtures.json fdr.json injury_log.json backtest.txt; do
            [ -f "_site/$f" ] && gzip -9 -c "_site/$f" > "$dir/$f.gz"
          done
          [ -d _site/plans ] && tar -czf "$dir/plans.tar.gz" -C _site plans
          date -u +"%Y-%m-%dT%H:%MZ" > "$dir/saved_at.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dir"
          git commit -m "Archive: $season GW${{ github.event.inputs.archive_gw }} before the deadline"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish the backups (for Admin > Backups)
        continue-on-error: true
        run: |
          mkdir -p _site/archive
          for d in archive/20*/gw*/ archive/20*/replay/gw*/; do
            [ -f "$d/saved_at.txt" ] || continue
            mkdir -p "_site/$d" && cp "$d"/*.gz "$d/saved_at.txt" "_site/$d" 2>/dev/null || true
          done
          python3 - <<'PY'
          import glob, json, os
          rows = []
          for d in sorted(glob.glob("archive/20*/gw*/saved_at.txt")):
              season, gw = d.split("/")[1], int(d.split("/")[2][2:])
              rows.append({"season": season, "gw": gw, "saved": open(d).read().strip(), "path": f"{season}/gw{gw}"})
          for d in sorted(glob.glob("archive/20*/replay/gw*/saved_at.txt")):
              season, gw = d.split("/")[1], int(d.split("/")[3][2:])
              rows.append({"season": season, "gw": gw, "saved": open(d).read().strip(), "path": f"{season}/replay/gw{gw}", "replay": True})
          json.dump(rows, open("_site/archive/index.json", "w"))
          print(len(rows), "backups")
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
