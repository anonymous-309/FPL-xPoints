name: Euro check
on:
  push:
    branches: [euro-rotation]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: fpl_data/20*
          key: fpl-history-v1
      - run: python fpl_xpoints.py download
      - run: python tools_debug_gk.py
