name: Planner solver test
on:
  workflow_dispatch:
    inputs:
      team:
        description: FPL team ID
        default: "41"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save highs@1.8.0
      - run: curl -sfL https://anonymous-309.github.io/FPL-xPoints/data.json -o /tmp/data.json
      - run: node tools/solvertest/run.js ${{ inputs.team }} /tmp/data.json
