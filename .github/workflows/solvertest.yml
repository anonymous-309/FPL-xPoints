name: Planner solver test
on:
  workflow_dispatch:
    inputs:
      team:
        description: FPL team ID
        default: "41"
      versions:
        description: highs versions to try
        default: "1.15.4"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm view highs versions --json | tr -d '\n '; echo; npm pack highs@1.15.4 >/dev/null && tar tzf highs-1.15.4.tgz && mkdir -p /tmp/h && tar xzf highs-1.15.4.tgz -C /tmp/h && head -c 400 /tmp/h/package/build/highs.js && echo && tail -c 600 /tmp/h/package/build/highs.js && echo && cat /tmp/h/package/package.json && npm view highs@1.15.4 time --json | tail -5
      - run: curl -sfL https://anonymous-309.github.io/FPL-xPoints/data.json -o /tmp/data.json
      - run: |
          for v in ${{ inputs.versions }}; do
            echo "=== highs $v"
            npm install --no-save highs@$v >/dev/null 2>&1 || { echo "install failed"; continue; }
            node tools/solvertest/run.js ${{ inputs.team }} /tmp/data.json || true
          done
