name: Planner solver test
on:
  workflow_dispatch:
    inputs:
      team:
        description: FPL team ID
        default: "41"
      versions:
        description: highs versions to try
        default: "1.8.0 1.7.0 1.5.0 1.2.0 1.0.0"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: curl -sfL https://anonymous-309.github.io/FPL-xPoints/data.json -o /tmp/data.json
      - run: |
          for v in ${{ inputs.versions }}; do
            echo "=== highs $v"
            npm install --no-save highs@$v >/dev/null 2>&1 || { echo "install failed"; continue; }
            node tools/solvertest/run.js ${{ inputs.team }} /tmp/data.json || true
          done
