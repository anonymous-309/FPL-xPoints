name: Probe injury sources
on:
  push:
    branches: [probe-injury-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -s -A "$UA" -o table.html https://www.premierinjuries.com/injury-table.php
          curl -s -A "$UA" -o lavia.html https://www.premierinjuries.com/newsroom/epl/players/romeo-lavia
          python3 - <<'PY'
          import re, base64, gzip
          t = open("table.html", encoding="utf-8", errors="replace").read()
          i = t.find("<table"); j = t.find("</table>", i)
          l = open("lavia.html", encoding="utf-8", errors="replace").read()
          k = l.find("<table"); m = l.find("</table>", k)
          blob = base64.b64encode(gzip.compress((t[i:j+8] + "\n=====SPLIT=====\n" + l[k:m+8]).encode())).decode()
          for n in range(0, len(blob), 3000):
              print("B64", blob[n:n+3000])
          PY
