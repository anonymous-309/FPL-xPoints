name: Probe injury sources
on:
  push:
    branches: [probe-injury-sources]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for slug in bukayo-saka romeo-lavia; do
            curl -s -A "$UA" -o "$slug.html" -w "$slug HTTP %{http_code}\n" "https://www.premierinjuries.com/newsroom/epl/players/$slug"
          done
          python3 - <<'PY'
          import re, html
          for slug in ("bukayo-saka", "romeo-lavia"):
              s = open(f"{slug}.html", encoding="utf-8", errors="replace").read()
              print("PAGE", slug, len(s), "tables", s.count("<table"))
              for t in re.findall(r"<table.*?</table>", s, re.S)[:4]:
                  for r in re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S)[:25]:
                      cells = [re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", c))).strip()[:90] for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", r, re.S)]
                      print("ROW", slug, cells)
              text = re.sub(r"\s+", " ", html.unescape(re.sub(r"<[^>]+>", " ", re.sub(r"<(script|style).*?</\1>", "", s, flags=re.S))))
              k = text.lower().find("history")
              print("TEXT", slug, text[max(0, k - 300):k + 1500] if k >= 0 else text[:1500])
          PY
