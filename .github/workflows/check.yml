name: Kiem tra treo gio
on:
  push:
    branches: [main]
    paths: [".github/workflows/check.yml", "tools/check_bans.py"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install requests && python tools/check_bans.py
